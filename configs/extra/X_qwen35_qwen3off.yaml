# G2: cross-model pair of two Qwen models.
# firm 1 = Qwen3.5-35B-A3B-GPTQ-Int4 (thinking off), firm 2 = Qwen3-14B-AWQ (thinking off). Two servers, 2 GPUs.
# Run with VENV_OVERRIDE=$HOME/envs/collusion-q35 (vLLM 0.17.1 serves BOTH models; Qwen3-14B's self-play used
# vLLM 0.11.2 -- an engine difference, disclosed). Seeds: 20 fresh, random.Random(35777).sample, written before
# any run. max_tokens 4096 for both firms, to match Qwen3.5 self-play (qwen35_a3b_4k). Prediction: docs/PREDICTIONS.md.
stage: s3x-qwen35-qwen3off
arm: X
prompt: E1
rounds: 300
seeds: [2145, 118467, 163565, 236136, 437081, 467661, 483564, 504300, 538580, 557630, 568413, 619666, 629046, 643000, 745318, 751607, 936032, 942893, 957144, 962327]
sampling:
  temperature: 0.7
  top_p: 1.0
  max_tokens: 4096
parallel_games: 10
firm1:
  provider: vllm
  model: Qwen/Qwen3.5-35B-A3B-GPTQ-Int4
  base_url: ${VLLM_BASE_URL}
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
firm2:
  provider: vllm
  model: Qwen/Qwen3-14B-AWQ
  base_url: ${VLLM_BASE_URL_2}
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
